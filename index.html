<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Archery Master 🎯🏹</title>
  <script src="arcade-leaderboard.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
    body { background:#070913; color:#fff; font-family:'Segoe UI',sans-serif; overflow:hidden; display:flex; justify-content:center; align-items:center; height:100vh; }
    #canvas-container { position:relative; width:100vw; height:100vh; max-width:800px; }
    @media (max-width: 600px) { .hud { font-size:16px; } .arcade-nav { font-size:11px; padding:6px 10px; } }
    canvas { width:100%; height:100%; display:block; background:#070913; }
    .arcade-nav { position:absolute; top:16px; right:16px; z-index:100; background:rgba(0,0,0,0.7); border:2px solid #05ffa1; color:#05ffa1; padding:8px 16px; border-radius:8px; font-weight:bold; text-decoration:none; font-size:13px; box-shadow:0 0 15px rgba(5,255,161,0.4); }
    .hud { position:absolute; top:16px; left:16px; font-family:monospace; font-size:20px; font-weight:bold; color:#05ffa1; text-shadow:0 0 10px #05ffa1; pointer-events:none; }
    .drag-hint { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); font-size:15px; color:#aaa; pointer-events:none; }
    #modal { position:absolute; inset:0; background:rgba(0,0,0,0.85); display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:200; }
    #modal h1 { color:#05ffa1; font-size:42px; text-shadow:0 0 20px #05ffa1; }
    .btn { background:linear-gradient(135deg,#05ffa1,#00f5ff); border:none; color:#000; padding:12px 32px; font-size:18px; font-weight:bold; border-radius:8px; cursor:pointer; text-decoration:none; box-shadow:0 0 20px rgba(5,255,161,0.5); }
  </style>
</head>
<body>
  <div id="canvas-container">
    <a href="https://marcuscaiado.github.io/marcus-arcade/" class="arcade-nav">🕹️ Arcade Hub</a>
    <div class="hud">SCORE: <span id="score-val">0</span> | ARROWS: <span id="arrows-val">10</span> | WIND: <span id="wind-val">0</span></div>
    <div class="drag-hint">Pull Back Bow to Aim & Release to Fire 🏹</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="modal">
      <h1 id="modal-title">ROUND COMPLETE! 🎯</h1>
      <p style="font-size:20px;">FINAL SCORE: <span id="final-score">0</span></p>
      <button class="btn" onclick="restartGame()">SHOOT AGAIN 🔄</button>
      <a href="https://marcuscaiado.github.io/marcus-arcade/" class="btn" style="background:#222; color:#fff; border:1px solid #05ffa1;">ARCADE HUB 🕹️</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Audio
    let audioCtx = null;
    function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
    function playSfx(freq, dur) {
      try {
        const c = getAudio(); const osc = c.createOscillator(); const g = c.createGain();
        osc.frequency.setValueAtTime(freq, c.currentTime);
        g.gain.setValueAtTime(0.12, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + dur);
        osc.connect(g); g.connect(c.destination); osc.start(); osc.stop(c.currentTime + dur);
      } catch(e){}
    }

    let score = 0, arrows = 10, wind = 0, isGameOver = false;
    let bowX = 120, bowY = 320;
    let isAiming = false, dragX = 0, dragY = 0;
    let activeArrow = null;
    let targets = [
      { x: 700, y: 300, vy: 2, r: 40 }
    ];
    let particles = [], hitPopups = [];

    function setWind() {
      wind = Number(((Math.random() - 0.5) * 4).toFixed(1));
      document.getElementById('wind-val').textContent = (wind > 0 ? '+' : '') + wind;
    }
    setWind();

    const getCanvasPos = (cx, cy) => {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((cx - rect.left) / rect.width) * 800,
        y: ((cy - rect.top) / rect.height) * 600
      };
    };

    function startAim(pos) {
      if (arrows <= 0 || activeArrow || isGameOver) return;
      if (pos.x < 240) {
        isAiming = true;
        dragX = pos.x; dragY = pos.y;
        playSfx(200, 0.05);
      }
    }

    function moveAim(pos) {
      if (!isAiming) return;
      dragX = pos.x; dragY = pos.y;
    }

    function releaseAim() {
      if (!isAiming) return;
      isAiming = false;

      const pullX = bowX - dragX;
      const pullY = bowY - dragY;
      const power = Math.min(Math.hypot(pullX, pullY) * 0.16, 25);
      const angle = Math.atan2(pullY, pullX);

      if (power > 3) {
        arrows--;
        document.getElementById('arrows-val').textContent = arrows;
        activeArrow = {
          x: bowX, y: bowY,
          vx: Math.cos(angle) * power,
          vy: Math.sin(angle) * power,
          angle: angle
        };
        playSfx(600, 0.12);
      }
    }

    window.addEventListener('mousedown', e => startAim(getCanvasPos(e.clientX, e.clientY)));
    window.addEventListener('mousemove', e => moveAim(getCanvasPos(e.clientX, e.clientY)));
    window.addEventListener('mouseup', releaseAim);

    window.addEventListener('touchstart', e => { e.preventDefault(); startAim(getCanvasPos(e.touches[0].clientX, e.touches[0].clientY)); }, { passive:false });
    window.addEventListener('touchmove', e => { e.preventDefault(); moveAim(getCanvasPos(e.touches[0].clientX, e.touches[0].clientY)); }, { passive:false });
    window.addEventListener('touchend', e => { e.preventDefault(); releaseAim(); }, { passive:false });

    function restartGame() {
      score = 0; arrows = 10; isGameOver = false; activeArrow = null; particles = []; hitPopups = [];
      setWind();
      document.getElementById('score-val').textContent = '0';
      document.getElementById('arrows-val').textContent = '10';
      document.getElementById('modal').style.display = 'none';
      requestAnimationFrame(loop);
    }

    function loop() {
      if (isGameOver) return;

      // Update Moving Target
      for (const t of targets) {
        t.y += t.vy;
        if (t.y < 100 || t.y > 500) t.vy *= -1;
      }

      // Update Active Arrow
      if (activeArrow) {
        activeArrow.vx += wind * 0.02;
        activeArrow.vy += 0.25; // Gravity
        activeArrow.x += activeArrow.vx;
        activeArrow.y += activeArrow.vy;
        activeArrow.angle = Math.atan2(activeArrow.vy, activeArrow.vx);

        // Arrow trail particles
        particles.push({ x: activeArrow.x, y: activeArrow.y, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2, color: '#05ffa1', life: 0.7 });

        // Check Target Hit
        for (const t of targets) {
          const dist = Math.hypot(activeArrow.x - t.x, activeArrow.y - t.y);
          if (dist < t.r) {
            let pts = 50;
            let text = 'HIT +50';
            if (dist < 10) { pts = 200; text = '🎯 BULLSEYE +200!'; playSfx(1200, 0.25); }
            else if (dist < 22) { pts = 100; text = 'GREAT +100!'; playSfx(900, 0.15); }
            else { playSfx(600, 0.1); }

            score += pts;
            document.getElementById('score-val').textContent = score;
            hitPopups.push({ x: t.x - 40, y: t.y - 20, text: text, life: 1 });

            // Sparkles
            for (let p=0; p<12; p++) particles.push({ x: activeArrow.x, y: activeArrow.y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, color:'#ffff00', life:1 });

            activeArrow = null;
            setWind();
            checkFinish();
            break;
          }
        }

        // Out of Bounds Arrow Miss
        if (activeArrow && (activeArrow.x > 840 || activeArrow.y > 620)) {
          activeArrow = null;
          setWind();
          checkFinish();
        }
      }

      // Render
      ctx.fillStyle = '#070913'; ctx.fillRect(0, 0, 800, 600);

      // Cyber Range Grid
      ctx.strokeStyle = 'rgba(5,255,161,0.06)'; ctx.lineWidth = 1;
      for (let x = 0; x < 800; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 600); ctx.stroke(); }
      for (let y = 0; y < 600; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke(); }

      // Draw Holographic Target
      for (const t of targets) {
        ctx.shadowBlur = 15;
        // Outer Ring
        ctx.fillStyle = 'rgba(255,0,127,0.3)'; ctx.strokeStyle = '#ff007f'; ctx.shadowColor = '#ff007f';
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // Mid Ring
        ctx.fillStyle = 'rgba(0,245,255,0.4)'; ctx.strokeStyle = '#00f5ff'; ctx.shadowColor = '#00f5ff';
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r * 0.55, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // Bullseye
        ctx.fillStyle = '#ffff00'; ctx.shadowColor = '#ffff00';
        ctx.beginPath(); ctx.arc(t.x, t.y, 8, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Draw Bow & Aim String
      ctx.strokeStyle = '#05ffa1'; ctx.lineWidth = 4;
      ctx.shadowColor = '#05ffa1'; ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(bowX, bowY, 32, -Math.PI / 2.2, Math.PI / 2.2);
      ctx.stroke();

      // Bow String
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      const topTipY = bowY - 30;
      const botTipY = bowY + 30;
      const gripX = isAiming ? dragX : bowX;
      const gripY = isAiming ? dragY : bowY;
      ctx.moveTo(bowX, topTipY);
      ctx.lineTo(gripX, gripY);
      ctx.lineTo(bowX, botTipY);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Trajectory Prediction Line
      if (isAiming) {
        const pullX = bowX - dragX;
        const pullY = bowY - dragY;
        const power = Math.min(Math.hypot(pullX, pullY) * 0.16, 25);
        const angle = Math.atan2(pullY, pullX);

        ctx.strokeStyle = 'rgba(255,255,0,0.3)'; ctx.setLineDash([4, 4]);
        ctx.beginPath();
        let simX = bowX, simY = bowY, simVx = Math.cos(angle) * power, simVy = Math.sin(angle) * power;
        ctx.moveTo(simX, simY);
        for (let s=0; s<25; s++) {
          simVx += wind * 0.02; simVy += 0.25;
          simX += simVx; simY += simVy;
          ctx.lineTo(simX, simY);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Draw Active Arrow
      if (activeArrow) {
        ctx.save();
        ctx.translate(activeArrow.x, activeArrow.y);
        ctx.rotate(activeArrow.angle);
        ctx.fillStyle = '#05ffa1';
        ctx.shadowColor = '#05ffa1'; ctx.shadowBlur = 12;
        ctx.fillRect(-20, -2, 40, 4);
        ctx.fillStyle = '#ffff00';
        ctx.beginPath(); ctx.moveTo(20, -4); ctx.lineTo(26, 0); ctx.lineTo(20, 4); ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.shadowBlur = 0;
      }

      // Draw Popups
      for (let i = hitPopups.length - 1; i >= 0; i--) {
        const pop = hitPopups[i];
        pop.y -= 1; pop.life -= 0.02;
        if (pop.life <= 0) { hitPopups.splice(i, 1); continue; }
        ctx.fillStyle = '#ffff00'; ctx.font = 'bold 18px Segoe UI'; ctx.globalAlpha = pop.life;
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.globalAlpha = 1;
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.04;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
      }

      requestAnimationFrame(loop);
    }

    function checkFinish() {
      if (arrows <= 0 && !activeArrow) {
        setTimeout(() => {
          isGameOver = true;
          document.getElementById('final-score').textContent = score;
          document.getElementById('modal').style.display = 'flex';
          try {
            if (window.ArcadeLeaderboard) {
              window.ArcadeLeaderboard.submitScore('neon-archery-master', score);
            }
          } catch(e){}
        }, 500);
      }
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
